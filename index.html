renderer.domElement.addEventListener('pointerup',e=>{if(!pointerDown)return;const moved=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y);pointerDown=null;if(moved>6)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const portalHits=raycaster.intersectObject(portalSurface,false),bookHits=raycaster.intersectObjects(bookTargets,false);if(portalHits.length&&(!bookHits.length||portalHits[0].distance<bookHits[0].distance)){burstTime=clock.getElapsedTime();notify('차원문이 반응합니다!');}else if(bookHits.length){bookOpen=!bookOpen;notify(bookOpen?'마법책이 펼쳐졌습니다.':'마법책을 닫았습니다.');}});
const tourTarget=new THREE.Vector3(0,4.2,0);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.getElapsedTime();for(const m of mistWisps){m.sprite.position.x=m.baseX+Math.sin(t*.13+m.phase)*.85;m.sprite.position.y=m.baseY+Math.sin(t*.28+m.phase)*.12;}portalShader.uniforms.uTime.value=t;outerRing.rotation.z=t*.09;innerRing.rotation.z=-t*.28;runes.rotation.z=-t*.12;const burst=Math.max(0,1-(t-burstTime)/1.3);portalLight.intensity=(boost?140:85)*(1+.1*Math.sin(t*2.5))+burst*100;portal.scale.setScalar(1+burst*.045);for(const b of flying){b.group.position.y=b.y+Math.sin(t*1.15+b.phase)*.3;b.group.rotation.y=t*.16+b.phase;b.group.rotation.z=Math.sin(t*.8+b.phase)*.12;}const angle=bookOpen?.5:.12;leftCover.rotation.z+=(-angle-leftCover.rotation.z)*.06;rightCover.rotation.z+=(angle-rightCover.rotation.z)*.06;leftPage.rotation.z=leftCover.rotation.z;rightPage.rotation.z=rightCover.rotation.z;magicBook.position.y=2.08+Math.sin(t*1.3)*.08;flames.forEach((f,i)=>{f.scale.y=1.4+Math.sin(t*8+i)*.23;});for(let i=0;i<particleCount;i++){particlePositions[i*3+1]+=particleSpeeds[i]*dt*.7;if(particlePositions[i*3+1]>13)particlePositions[i*3+1]=.5;}particleGeometry.attributes.position.needsUpdate=true;if(autoTour){const a=t*.13;camera.position.lerp(new THREE.Vector3(Math.cos(a)*26,13+Math.sin(t*.22)*3,Math.sin(a)*26),.018);controls.target.lerp(tourTarget,.035);}if(performance.now()>toastUntil)toast.style.opacity='0';controls.update();renderer.render(scene,camera);}
animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
console.log('Between Pages 4.0 — Dimensional Mist loaded');
</script>
